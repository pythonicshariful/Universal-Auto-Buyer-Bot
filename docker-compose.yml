version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-target_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-target_password}
      POSTGRES_DB: target_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-target_user}:${POSTGRES_PASSWORD:-target_password}@db:5432/target_monitor
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
